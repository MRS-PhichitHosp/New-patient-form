<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการเจ้าหน้าที่ห้องเวชระเบียน - โรงพยาบาลพิจิตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F6;
    --surface:#FFFFFF;
    --ink:#17282A;
    --ink-soft:#4B5F61;
    --teal-900:#0F3D3E;
    --teal-700:#175C5A;
    --teal-600:#1F6F6B;
    --teal-100:#E5F1EE;
    --amber:#C98A3E;
    --line:#DCE4E2;
    --error:#B3452C;
    --radius:14px;
    --shadow:0 2px 10px rgba(15,61,62,0.07), 0 1px 2px rgba(15,61,62,0.06);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    margin:0;padding:0;
  }
  h1,h2,h3{font-family:'Prompt',sans-serif;}
  
  .auth-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(15,61,62,0.85);
    display:flex;align-items:center;justify-content:center;z-index:9999;
  }
  .auth-box{
    background:#fff;padding:30px;border-radius:16px;width:90%;max-width:380px;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);text-align:center;
  }
  .auth-box h2{color:var(--teal-900);margin-top:0;font-size:20px;}
  .auth-box p{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;}
  .auth-box input{
    width:100%;padding:12px;font-size:18px;text-align:center;
    border:2px solid var(--line);border-radius:10px;margin-bottom:14px;
    font-family:'Prompt',sans-serif;letter-spacing:4px;
  }
  .auth-box input:focus{border-color:var(--teal-600);outline:none;}
  .btn{
    font-family:'Sarabun',sans-serif;font-weight:600;font-size:14px;
    border-radius:9px;padding:10px 18px;border:none;cursor:pointer;width:100%;
    background:var(--teal-900);color:#fff;
  }
  .btn:hover{filter:brightness(1.1);}

  .container{max-width:1100px;margin:30px auto;padding:0 20px;}
  .header{
    background:var(--teal-900);color:#fff;padding:20px 24px;border-radius:14px;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;
  }
  .header h1{margin:0;font-size:18px;}
  .header p{margin:4px 0 0;font-size:12.5px;opacity:0.8;}

  .card{
    background:#fff;border-radius:14px;padding:24px;box-shadow:var(--shadow);
  }
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;
  }
  .filter-group{display:flex;align-items:center;gap:10px;}
  .filter-group input{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;}
  
  .btn-ghost{background:transparent;color:var(--teal-900);border:1.5px solid var(--line);width:auto;padding:8px 14px;}
  .btn-ghost:hover{background:var(--teal-100);}
  .btn-primary{background:var(--teal-900);color:#fff;width:auto;padding:6px 12px;font-size:13px;}

  .table-responsive{width:100%;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;}
  th{background:var(--teal-100);color:var(--teal-900);font-family:'Prompt',sans-serif;}
  .badge-status{padding:3px 8px;border-radius:4px;font-size:11.5px;font-weight:600;}
  .badge-printed{background:#E8F5E9;color:#2E7D32;}
  .badge-unprinted{background:#FFF3E0;color:#E65100;}

  /* Print Styles */
  #printArea{display:none;}
  @media print{
    @page { size: A5 landscape; margin: 6mm; }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;position:absolute;top:0;left:0;
      width:198mm;height:136mm;padding:4mm;
      font-family:'Sarabun',sans-serif;color:#111;box-sizing:border-box;overflow:hidden;
    }
    .p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid #0F3D3E;padding-bottom:4px;margin-bottom:6px;}
    .p-head h1{font-size:13.5px;margin:0;color:#0F3D3E;font-family:'Prompt',sans-serif;}
    .p-head p{margin:1px 0 0;font-size:9px;color:#555;}
    .p-photo{width:50px;height:60px;object-fit:cover;border:1px solid #ccc;border-radius:3px;}
    .p-sec{margin-bottom:6px;}
    .p-sec h3{font-size:10.5px;background:#E5F1EE;color:#0F3D3E;padding:2px 5px;margin:0 0 3px;border-radius:2px;}
    .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:9.5px;}
    .p-grid div{padding:1px 0;border-bottom:1px dotted #ddd;}
    .p-grid b{color:#0F3D3E;}
    .p-staff{margin-top:6px;border:1px dashed #C98A3E;border-radius:4px;padding:6px 8px;font-size:9px;}
    .p-staff h3{font-size:9.5px;color:#8a5a1f;margin:0 0 4px;}
    .p-staff .row{display:flex;gap:15px;margin-bottom:4px;}
    .p-staff .row div{flex:1;border-bottom:1px solid #999;padding-bottom:6px;}
    .p-sign{margin-top:6px;font-size:9.5px;display:flex;justify-content:space-between;}
  }
</style>
</head>
<body>

<!-- AUTH MODAL -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>🔒 เข้าสู่ระบบเจ้าหน้าที่</h2>
    <p>โรงพยาบาลพิจิตร</p>
    <form id="authForm">
      <input type="password" id="pinInput" placeholder="•••••" maxlength="5" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn">เข้าสู่ระบบ</button>
    </form>
    <div id="authErr" style="color:var(--error);font-size:13px;margin-top:10px;display:none;">รหัสผ่านไม่ถูกต้อง!</div>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header">
    <div>
      <h1>ระบบจัดการสำหรับเจ้าหน้าที่ห้องเวชระเบียน</h1>
      <p>โรงพยาบาลพิจิตร — ตรวจสอบรายชื่อและพิมพ์เอกสารผู้ป่วยใหม่ล่วงหน้า</p>
    </div>
    <button class="btn btn-ghost" onclick="logout()" style="background:#fff; color:var(--teal-900);">ออกจากระบบ</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="filter-group">
        <label style="font-weight:600;">กรองตามวันที่:</label>
        <input type="date" id="filterDateInput">
        <button class="btn btn-ghost" id="clearDateBtn">แสดงทั้งหมด</button>
      </div>
      <div id="countLbl" style="font-size:13.5px;color:var(--ink-soft);"></div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>คำนำหน้า</th>
            <th>ชื่อ</th>
            <th>สกุล</th>
            <th>วันที่กรอกข้อมูล / สถานะการพิมพ์</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
const CORRECT_PIN = "10726";

document.getElementById('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const pin = document.getElementById('pinInput').value;
  if(pin === CORRECT_PIN){
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    initStaffDashboard();
  } else {
    const err = document.getElementById('authErr');
    err.style.display = 'block';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
});

function logout(){
  location.reload();
}

const STORAGE_SUBMISSIONS = 'phichit_all_submissions_v3';
function getAllSubmissions(){
  try{
    const all = localStorage.getItem(STORAGE_SUBMISSIONS);
    return all ? JSON.parse(all) : [];
  }catch(e){ return []; }
}
function saveAllSubmissions(list){
  try{ 
    localStorage.setItem(STORAGE_SUBMISSIONS, JSON.stringify(list)); 
  }catch(e){} 
}

function initStaffDashboard(){
  const todayStr = new Date().toISOString().split('T')[0];
  const dateInput = document.getElementById('filterDateInput');
  dateInput.value = todayStr;

  dateInput.addEventListener('change', () => renderTable(dateInput.value));
  document.getElementById('clearDateBtn').addEventListener('click', () => {
    dateInput.value = '';
    renderTable('');
  });

  renderTable(todayStr);
}

function renderTable(filterDate){
  const submissions = getAllSubmissions();
  const filtered = submissions.filter(item => {
    if(!filterDate) return true;
    if(!item.createdAt) return false;
    return item.createdAt.startsWith(filterDate);
  });

  document.getElementById('countLbl').textContent = 'ทั้งหมด ' + filtered.length + ' รายการ';
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding:24px;">ไม่พบข้อมูลการลงทะเบียนในวันที่เลือก</td></tr>`;
    return;
  }

  filtered.forEach((item, index) => {
    const fullPrefix = item.prefix === 'อื่นๆ' ? item.prefixOther : item.prefix;
    const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleString('th-TH') : '-';
    const isPrinted = item.printed;
    const statusBadge = isPrinted 
      ? `<span class="badge-status badge-printed">พิมพ์แล้ว (${new Date(item.printedAt).toLocaleTimeString('th-TH')})</span>` 
      : `<span class="badge-status badge-unprinted">ยังไม่เคยพิมพ์</span>`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${esc(fullPrefix)}</td>
      <td>${esc(item.firstname)}</td>
      <td>${esc(item.lastname)}</td>
      <td>${dateFormatted}<br><small style="color:#666;">${statusBadge}</small></td>
      <td>
        <button class="btn btn-primary" onclick="printPatientDoc('${item.id}')">🖨️ พิมพ์เอกสาร PDF</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.printPatientDoc = function(id){
  const submissions = getAllSubmissions();
  const item = submissions.find(s => s.id === id);
  if(!item) return;

  item.printed = true;
  item.printedAt = new Date().toISOString();
  saveAllSubmissions(submissions);

  buildPrintAreaFromData(item);
  window.print();

  renderTable(document.getElementById('filterDateInput').value);
};

function buildPrintAreaFromData(patientData){
  const pa=document.getElementById('printArea');
  const now=new Date();
  const fullPrefix = patientData.prefix === 'อื่นๆ' ? patientData.prefixOther : patientData.prefix;
  const fullReligion = patientData.religion === 'อื่นๆ' ? patientData.religionOther : patientData.religion;
  const fullEcRelation = patientData.ec_relation === 'อื่นๆ' ? patientData.ec_relationOther : patientData.ec_relation;

  pa.innerHTML=`
    <div class="p-head">
      <div>
        <h1>เอกสารลงทะเบียนผู้ป่วยใหม่ (Pre-registration) — โรงพยาบาลพิจิตร</h1>
        <p>พิมพ์เมื่อ ${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} | เจ้าหน้าที่ห้องบัตรสั่งพิมพ์ (พิมพ์แล้ว)</p>
      </div>
      ${patientData.photoDataUrl? `<img class="p-photo" src="${patientData.photoDataUrl}">` : ''}
    </div>

    <div class="p-sec"><h3>ข้อมูลส่วนตัว</h3><div class="p-grid">
      <div><b>ชื่อ-นามสกุล:</b> ${esc(`${fullPrefix} ${patientData.firstname} ${patientData.lastname}`.trim())}</div>
      <div><b>เลขบัตรประชาชน:</b> ${esc(patientData.nid)}</div>
      <div><b>บิดา:</b> ${esc(patientData.fatherName) || '-'}</div>
      <div><b>มารดา:</b> ${esc(patientData.motherName) || '-'}</div>
      <div><b>วัน เดือน ปี เกิด:</b> ${patientData.dob? esc(thaiDate(patientData.dob))+' (อายุ '+calcAge(patientData.dob)+')':'-'}</div>
      <div><b>เพศ:</b> ${esc(patientData.gender)}</div>
      <div><b>สถานภาพสมรส:</b> ${esc(patientData.marital)||'-'}</div>
      <div><b>เชื้อชาติ/สัญชาติ:</b> ${esc(patientData.ethnicity)} / ${esc(patientData.nationality)}</div>
      <div><b>ศาสนา:</b> ${esc(fullReligion)||'-'}</div>
      <div><b>หมู่เลือด:</b> ${esc(patientData.blood)||'ไม่ทราบ'}</div>
      <div style="grid-column:1/-1;"><b>ประวัติแพ้ยา:</b> ${esc(patientData.allergyDrug)}</div>
    </div></div>

    <div class="p-sec"><h3>ข้อมูลการติดต่อ</h3><div class="p-grid">
      <div style="grid-column:1/-1;"><b>ที่อยู่ปัจจุบัน:</b> ${esc(`${patientData.addr_no} หมู่ ${patientData.addr_moo} ต.${patientData.addr_tambon} อ.${patientData.addr_amphoe} จ.${patientData.addr_province} ${patientData.addr_zip}`)}</div>
      <div><b>โทรศัพท์มือถือ:</b> ${esc(patientData.phone)}</div>
    </div></div>

    <div class="p-sec"><h3>ผู้ติดต่อฉุกเฉิน</h3><div class="p-grid">
      <div><b>ชื่อ-นามสกุล:</b> ${esc(patientData.ec_name)}</div>
      <div><b>ความสัมพันธ์:</b> ${esc(fullEcRelation)}</div>
      <div><b>ที่อยู่:</b> ${esc(patientData.ec_addr)||'-'}</div>
      <div><b>เบอร์โทร:</b> ${esc(patientData.ec_phone)}</div>
    </div></div>

    <div class="p-sign">
      <div>ลงชื่อผู้ป่วย: ${esc(patientData.signName)}</div>
      <div>ลงชื่อผู้ให้ข้อมูล: ${esc(patientData.infoGiverName) || '-'}</div>
      <div>วันที่: ${now.toLocaleDateString('th-TH')}</div>
    </div>

    <div class="p-staff">
      <h3>สำหรับเจ้าหน้าที่ห้องบัตร (Staff use only)</h3>
      <div class="row">
        <div>เลขประจำตัวผู้ป่วย (HN):</div>
        <div>วันที่รับเอกสาร:</div>
        <div>ผู้บันทึกข้อมูล:</div>
      </div>
    </div>
  `;
}

function calcAge(dob){
  if(!dob) return '';
  const d=new Date(dob), n=new Date();
  let years=n.getFullYear()-d.getFullYear();
  let months=n.getMonth()-d.getMonth();
  if(n.getDate()<d.getDate()) months--;
  if(months<0){years--; months+=12;}
  if(years<0) return '';
  if(years===0) return months+' เดือน';
  return years+' ปี'+(months>0? ' '+months+' เดือน':'');
}
function thaiDate(dob){
  if(!dob) return '';
  const d=new Date(dob);
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543);
}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
</body>
</html>
