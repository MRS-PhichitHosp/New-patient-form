<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฟอร์มลงทะเบียนผู้ป่วยใหม่ล่วงหน้า - โรงพยาบาลพิจิตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F6;
    --surface:#FFFFFF;
    --ink:#17282A;
    --ink-soft:#4B5F61;
    --teal-900:#0F3D3E;
    --teal-700:#175C5A;
    --teal-600:#1F6F6B;
    --teal-100:#E5F1EE;
    --amber:#C98A3E;
    --amber-100:#F7ECDA;
    --line:#DCE4E2;
    --error:#B3452C;
    --radius:14px;
    --shadow:0 2px 10px rgba(15,61,62,0.07), 0 1px 2px rgba(15,61,62,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    font-size:15.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .topbar .mark{
    width:44px;height:44px;border-radius:11px;
    background:linear-gradient(155deg,var(--teal-900),var(--teal-600));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:var(--shadow);
  }
  .topbar .mark svg{width:24px;height:24px;}
  .topbar h1{font-size:19px;font-weight:600;margin:0;color:var(--teal-900);}
  .topbar p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
  .staff-btn{
    background:var(--teal-100);color:var(--teal-900);border:1px solid var(--teal-600);
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .staff-btn:hover{background:var(--teal-600);color:#fff;}

  .layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    .sidebar{order:2;}
    .panel{order:1;}
  }

  /* Sidebar */
  .sidebar{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px;}
  @media (max-width:860px){.sidebar{position:static;}}

  .steps{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:8px;
  }
  .step-item{
    display:flex;align-items:center;gap:11px;
    padding:11px 12px;border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .step-item:hover{background:var(--teal-100);}
  .step-item.active{background:var(--teal-100);}
  .step-num{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;font-family:'Prompt',sans-serif;
    background:var(--line);color:var(--ink-soft);
    flex-shrink:0;
    transition:background .15s, color .15s;
  }
  .step-item.active .step-num{background:var(--teal-900);color:#fff;}
  .step-item.done .step-num{background:var(--teal-600);color:#fff;}
  .step-label{font-size:13.8px;color:var(--ink-soft);}
  .step-item.active .step-label{color:var(--teal-900);font-weight:600;}
  .step-item.done .step-label{color:var(--ink);}

  /* Live patient card */
  .idcard{
    border-radius:16px;
    overflow:hidden;
    background:var(--surface);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .idcard-top{
    background:linear-gradient(120deg,var(--teal-900) 0%,var(--teal-700) 60%,var(--teal-600) 100%);
    padding:14px 16px 34px;
    position:relative;
  }
  .idcard-top .tag{
    color:rgba(255,255,255,.78);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-family:'Prompt',sans-serif;
  }
  .idcard-top .hospital{color:#fff;font-family:'Prompt',sans-serif;font-weight:600;font-size:14px;margin-top:2px;}
  .idcard-body{
    padding:0 16px 16px;
    margin-top:-26px;
    display:flex;
    gap:12px;
    align-items:flex-end;
  }
  .idcard-photo{
    width:64px;height:64px;border-radius:12px;
    background:#fff;
    border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--line);
  }
  .idcard-photo img{width:100%;height:100%;object-fit:cover;}
  .idcard-photo svg{width:28px;height:28px;color:#c7d3d1;}
  .idcard-name{font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;color:var(--teal-900);line-height:1.25;padding-bottom:4px;}
  .idcard-name span{display:block;font-family:'Sarabun',sans-serif;font-weight:400;font-size:12px;color:var(--ink-soft);}
  .idcard-meta{
    padding:0 16px 16px;
    display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;
  }
  .idcard-meta div{font-size:11.5px;color:var(--ink-soft);}
  .idcard-meta b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;margin-top:1px;}
  .idcard-hn{
    margin:0 16px 16px;
    border:1.5px dashed var(--amber);
    background:var(--amber-100);
    border-radius:10px;
    padding:8px 10px;
    font-size:11.5px;
    color:#8a5a1f;
  }

  /* Panel / form */
  .panel{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 30px 26px;
    min-height:420px;
  }
  .panel h2{font-size:18px;color:var(--teal-900);margin:0 0 2px;}
  .panel .sub{color:var(--ink-soft);font-size:13.3px;margin:0 0 22px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .full{grid-column:1/-1;}
  @media (max-width:560px){.grid,.grid.g3{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  label .req{color:var(--error);}
  input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    font-family:'Sarabun',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-600);}
  textarea{resize:vertical;min-height:64px;}
  .field{margin-bottom:2px;}
  .hint{font-size:11.8px;color:#8b9a9a;margin-top:5px;}
  .err-msg{font-size:11.8px;color:var(--error);margin-top:5px;display:none;}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--error);}
  .field.invalid .err-msg{display:block;}
  .age-badge{
    display:inline-block;margin-top:6px;font-size:12px;color:var(--teal-700);
    background:var(--teal-100);padding:3px 10px;border-radius:20px;font-weight:600;
  }

  .checkrow{display:flex;align-items:flex-start;gap:8px;margin:4px 0 14px;}
  .checkrow input{width:16px;height:16px;margin-top:3px;}
  .checkrow label{margin:0;font-size:13.5px;color:var(--ink);}

  .radiorow{display:flex;gap:18px;flex-wrap:wrap;}
  .radiorow label{display:flex;align-items:center;gap:6px;font-size:13.8px;color:var(--ink);margin:0;font-weight:400;}
  .radiorow input{width:15px;height:15px;}

  .photo-upload{
    display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  }
  .photo-box{
    width:120px;height:120px;border-radius:14px;
    border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:var(--teal-100);flex-shrink:0;
  }
  .photo-box img{width:100%;height:100%;object-fit:cover;}
  .photo-box svg{width:32px;height:32px;color:#9db3b0;}
  .btn{
    font-family:'Sarabun',sans-serif;font-weight:600;font-size:14px;
    border-radius:9px;padding:10px 18px;border:none;cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal-900);color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--teal-900);border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--teal-100);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-success{background:#2E7D32;color:#fff;}
  .btn-success:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .footer-nav{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);}

  /* Review */
  .review-section{margin-bottom:14px;}
  .review-section h3{font-size:14px;color:var(--teal-900);margin:0 0 6px;display:flex;align-items:center;justify-content:space-between;}
  .review-section h3 button{font-size:11.5px;color:var(--teal-600);background:none;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;text-decoration:underline;}
  .review-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;}
  .review-grid .k{color:var(--ink-soft);}
  .review-grid .v{color:var(--ink);font-weight:500;}
  .review-grid .full{grid-column:1/-1;}
  @media (max-width:560px){.review-grid{grid-template-columns:1fr;}}

  .consent-box{
    background:var(--teal-100);border-radius:12px;padding:14px;margin-top:6px;
  }
  .notice-edit{
    margin-top:8px;font-size:12.5px;color:var(--error);font-weight:600;background:#FDF3F2;padding:8px 12px;border-radius:8px;border:1px dashed #E5B3AE;
  }

  /* Staff Modal */
  .modal-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:9999;
  }
  .modal-content{
    background:#fff;border-radius:12px;width:90%;max-width:900px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 4px 20px rgba(0,0,0,0.2);overflow:hidden;
  }
  .modal-header{
    background:var(--teal-900);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
  }
  .modal-header h3{margin:0;font-size:16px;}
  .modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .modal-body{padding:20px;overflow-y:auto;flex:1;}
  .table-responsive{width:100%;overflow-x:auto;}
  table.staff-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;}
  table.staff-table th, table.staff-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
  table.staff-table th{background:var(--teal-100);color:var(--teal-900);}
  .badge-status{padding:3px 8px;border-radius:4px;font-size:11.5px;font-weight:600;}
  .badge-printed{background:#E8F5E9;color:#2E7D32;}
  .badge-unprinted{background:#FFF3E0;color:#E65100;}

  /* ===== Print stylesheet (A5 Landscape - Exactly 1 page) ===== */
  #printArea{display:none;}
  @media print{
    @page {
      size: A5 landscape;
      margin: 6mm;
    }
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;
      top:0;left:0;
      width:198mm;
      height:136mm;
      padding:4mm;
      font-family:'Sarabun',sans-serif;
      color:#111;
      box-sizing:border-box;
      overflow:hidden;
    }
    .p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid #0F3D3E;padding-bottom:4px;margin-bottom:6px;}
    .p-head h1{font-size:13.5px;margin:0;color:#0F3D3E;font-family:'Prompt',sans-serif;}
    .p-head p{margin:1px 0 0;font-size:9px;color:#555;}
    .p-photo{width:50px;height:60px;object-fit:cover;border:1px solid #ccc;border-radius:3px;}
    .p-sec{margin-bottom:6px;}
    .p-sec h3{font-size:10.5px;background:#E5F1EE;color:#0F3D3E;padding:2px 5px;margin:0 0 3px;border-radius:2px;}
    .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:9.5px;}
    .p-grid div{padding:1px 0;border-bottom:1px dotted #ddd;}
    .p-grid b{color:#0F3D3E;}
    .p-staff{margin-top:6px;border:1px dashed #C98A3E;border-radius:4px;padding:6px 8px;font-size:9px;}
    .p-staff h3{font-size:9.5px;color:#8a5a1f;margin:0 0 4px;}
    .p-staff .row{display:flex;gap:15px;margin-bottom:4px;}
    .p-staff .row div{flex:1;border-bottom:1px solid #999;padding-bottom:6px;}
    .p-sign{margin-top:6px;font-size:9.5px;display:flex;justify-content:space-between;}
  }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="topbar">
    <div class="topbar-left" id="openStaffModalBtn">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>ลงทะเบียนผู้ป่วยใหม่ล่วงหน้า - โรงพยาบาลพิจิตร</h1>
        <p>กรอกประวัติก่อนมาโรงพยาบาล เพื่อลดเวลารอที่ห้องบัตร</p>
      </div>
    </div>
    <div>
      <button class="staff-btn" type="button" id="btnStaffPortal">🔒 สำหรับเจ้าหน้าที่ รพ.</button>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="steps" id="stepsList"></div>

      <div class="idcard" id="idcard">
        <div class="idcard-top">
          <div class="tag">แบบตัวอย่างบัตรผู้ป่วย</div>
          <div class="hospital">โรงพยาบาลพิจิตร</div>
        </div>
        <div class="idcard-body">
          <div class="idcard-photo" id="idcardPhotoBox">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3l2-2h6l2 2h3v13H4V7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6"/></svg>
          </div>
          <div class="idcard-name" id="idcardName">ยังไม่ระบุชื่อ<span id="idcardNick"></span></div>
        </div>
        <div class="idcard-meta">
          <div>เพศ / อายุ<b id="idcardGender">–</b></div>
          <div>หมู่เลือด<b id="idcardBlood">–</b></div>
          <div>แพ้ยา<b id="idcardAllergy">–</b></div>
          <div>โทรศัพท์<b id="idcardPhone">–</b></div>
        </div>
        <div class="idcard-hn">เลขประจำตัวผู้ป่วย (HN) — เจ้าหน้าที่ห้องบัตรจะออกให้เมื่อมาถึงโรงพยาบาล</div>
      </div>
    </div>

    <!-- FORM PANEL -->
    <div class="panel" id="panel"></div>
  </div>
</div>

<!-- PRINT-ONLY DOCUMENT -->
<div id="printArea"></div>

<!-- STAFF MODAL CONTAINER -->
<div id="staffModalContainer"></div>

<script>
/* ---------------- state ---------------- */
const data = {
  id:'', createdAt:'', printed:false, printedAt:'',
  prefix:'', prefixOther:'', firstname:'', lastname:'', nid:'', dob:'', gender:'', marital:'', ethnicity:'ไทย', nationality:'ไทย', religion:'', religionOther:'', blood:'', allergyDrug:'',
  addr_no:'', addr_moo:'', addr_tambon:'', addr_amphoe:'', addr_province:'พิจิตร', addr_zip:'', phone:'',
  ec_name:'', ec_relation:'', ec_relationOther:'', ec_addr:'', ec_phone:'',
  photoDataUrl:'',
  consent:false, signName:'', infoGiverName:''
};

const steps = [
  {id:'personal', label:'ข้อมูลส่วนตัว'},
  {id:'contact', label:'ข้อมูลการติดต่อ'},
  {id:'emergency', label:'ผู้ติดต่อฉุกเฉิน'},
  {id:'photo', label:'แนบรูปถ่าย'},
  {id:'review', label:'ตรวจสอบ & ส่งออก'},
];
let current = 0;
let isSubmitted = false;

/* ---------------- helpers ---------------- */
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function calcAge(dob){
  if(!dob) return '';
  const d=new Date(dob), n=new Date();
  let years=n.getFullYear()-d.getFullYear();
  let months=n.getMonth()-d.getMonth();
  if(n.getDate()<d.getDate()) months--;
  if(months<0){years--; months+=12;}
  if(years<0) return '';
  if(years===0) return months+' เดือน';
  return years+' ปี'+(months>0? ' '+months+' เดือน':'');
}
function thaiDate(dob){
  if(!dob) return '';
  const d=new Date(dob);
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543);
}

/* ---------------- database / submission storage ---------------- */
const STORAGE_CURRENT = 'phichit_current_draft_v3';
const STORAGE_SUBMISSIONS = 'phichit_all_submissions_v3';

function saveDraft(){
  if(isSubmitted) return;
  try{ localStorage.setItem(STORAGE_CURRENT, JSON.stringify(data)); }catch(e){}
}
function loadDraft(){
  try{
    const saved = localStorage.getItem(STORAGE_CURRENT);
    if(saved){
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(k => { data[k] = parsed[k]; });
    }
  }catch(e){}
}
loadDraft();

function getAllSubmissions(){
  try{
    const all = localStorage.getItem(STORAGE_SUBMISSIONS);
    return all ? JSON.parse(all) : [];
  }catch(e){ return []; }
}
function saveAllSubmissions(list){
  try{ localStorage.setItem(STORAGE_SUBMISSIONS, JSON.stringify(list)); }catch(e){}
}

function commitSubmission(){
  const list = getAllSubmissions();
  if(!data.id){
    data.id = 'P-' + Date.now();
    data.createdAt = new Date().toISOString();
  }
  // check if exists update or push
  const idx = list.findIndex(item => item.id === data.id);
  if(idx >= 0){
    list[idx] = JSON.parse(JSON.stringify(data));
  } else {
    list.unshift(JSON.parse(JSON.stringify(data)));
  }
  saveAllSubmissions(list);
  isSubmitted = true;
  try{ localStorage.removeItem(STORAGE_CURRENT); }catch(e){}
}

/* ---------------- sidebar steps ---------------- */
function renderSteps(){
  const box=document.getElementById('stepsList');
  box.innerHTML='';
  steps.forEach((s,i)=>{
    const item=el(`<div class="step-item ${i===current?'active':''} ${i<current?'done':''}" data-i="${i}">
      <div class="step-num">${i<current?'✓':i+1}</div>
      <div class="step-label">${s.label}</div>
    </div>`);
    item.addEventListener('click',()=>{ 
      if(isSubmitted) { alert('ข้อมูลนี้ถูกบันทึกส่งออกแล้ว ไม่สามารถแก้ไขได้'); return; }
      if(i<current){ current=i; renderAll(); } 
      else if(i===current+1){ if(validateStep(current)){current=i; renderAll();} } 
    });
    box.appendChild(item);
  });
}

/* ---------------- live card preview ---------------- */
function updateCard(){
  const actualPrefix = data.prefix === 'อื่นๆ' ? data.prefixOther : data.prefix;
  const name = (actualPrefix||'') + (data.firstname? ' '+data.firstname:'') + (data.lastname? ' '+data.lastname:'');
  document.getElementById('idcardName').innerHTML = (name.trim()? esc(name.trim()) : 'ยังไม่ระบุชื่อ') + '<span></span>';
  const genderTxt = data.gender ? data.gender + (data.dob? ' / '+calcAge(data.dob):'') : (data.dob? calcAge(data.dob):'–');
  document.getElementById('idcardGender').textContent = genderTxt || '–';
  document.getElementById('idcardBlood').textContent = data.blood || '–';

/* ---------------- field builder ---------------- */
function field(labelTxt, inputHtml, opts={}){
  const req = opts.required ? '<span class="req"> *</span>' : '';
  const cls = opts.full ? 'field full' : 'field';
  return `<div class="${cls}" data-field="${opts.name||''}">
    <label>${labelTxt}${req}</label>
    ${inputHtml}
    ${opts.hint? `<div class="hint">${opts.hint}</div>`:''}
    <div class="err-msg">กรุณากรอกข้อมูลนี้</div>
  </div>`;
}
function bind(name, transform){
  return (e)=>{ 
    if(isSubmitted) return;
    data[name] = transform? transform(e.target.value): e.target.value; 
    updateCard(); 
  };
}

/* ---------------- step renderers ---------------- */
function renderPanel(){
  const panel=document.getElementById('panel');
  panel.innerHTML='';
  const s=steps[current].id;
  if(s==='personal') return renderPersonal(panel);
  if(s==='contact') return renderContact(panel);
  if(s==='emergency') return renderEmergency(panel);
  if(s==='photo') return renderPhoto(panel);
  if(s==='review') return renderReview(panel);
}

function nav(container){
  const wrap=el(`<div class="footer-nav"></div>`);
  const back=el(`<button class="btn btn-ghost" type="button">‹ ย้อนกลับ</button>`);
  back.disabled = current===0;
  back.addEventListener('click',()=>{ if(current>0){current--; renderAll();} });
  wrap.appendChild(back);

  if(current < steps.length-1){
    const next=el(`<button class="btn btn-primary" type="button">ถัดไป ›</button>`);
    next.addEventListener('click',()=>{ 
      if(isSubmitted) { alert('ข้อมูลถูกบันทึกไปแล้ว'); current++; renderAll(); return; }
      if(validateStep(current)){ current++; renderAll(); } 
    });
    wrap.appendChild(next);
  } else {
    // หน้าสุดท้าย ไม่ต้องมีปุ่มถัดไป
    wrap.appendChild(el(`<div></div>`));
  }
  container.appendChild(wrap);
}

function head(container, title, sub){
  container.appendChild(el(`<h2>${title}</h2>`));
  container.appendChild(el(`<p class="sub">${sub}</p>`));
}

  const rightBtns = el(`<div style="display:flex; gap:10px; flex-wrap:wrap;"></div>`);
  
  if(!isSubmitted){
    const saveBtn = el(`<button class="btn btn-amber" type="button">💾 บันทึกข้อมูล</button>`);
    saveBtn.addEventListener('click', ()=>{
      if(!document.getElementById('consentChk').checked){
        alert('กรุณากดยินยอมรับรองข้อมูลก่อนบันทึก');
        return;
      }
      if(!data.signName.trim()){
        alert('กรุณาพิมพ์ชื่อ-นามสกุลผู้ป่วยเพื่อลงชื่อยืนยันก่อนบันทึก');
        return;
      }
      commitSubmission();
      alert('บันทึกข้อมูลสำเร็จ! ข้อมูลถูกส่งเข้าฐานข้อมูลของห้องเวชระเบียนเรียบร้อยแล้ว (ไม่สามารถแก้ไขข้อมูลได้อีก)');
      renderAll();
    });
    rightBtns.appendChild(saveBtn);
  } else {
    const lockedMsg = el(`<span style="color:#2E7D32; font-weight:600; display:flex; align-items:center;">✔️ บันทึกข้อมูลเรียบร้อยแล้ว</span>`);
    rightBtns.appendChild(lockedMsg);
  }

  actions.appendChild(back);
  actions.appendChild(rightBtns);
  p.appendChild(actions);
}

/* ---------------- wiring + validation ---------------- */
function wireInputs(container){
  container.querySelectorAll('[data-b]').forEach(inp=>{
    const name=inp.dataset.b;
    if(['prefix','prefixOther','religion','religionOther','ec_relation','ec_relationOther'].includes(name)) return;
    if(inp.type==='radio'){ if(data[name]===inp.value) inp.checked=true; inp.addEventListener('change',bind(name)); }
    else if(inp.type==='checkbox'){ inp.checked=!!data[name]; inp.addEventListener('change',(e)=>{if(!isSubmitted){data[name]=e.target.checked; updateCard();}}); }
    else { inp.value = data[name]||''; inp.addEventListener('input', bind(name)); }
  });
}

const requiredByStep = {
  0:['prefix','firstname','lastname','nid','dob','gender','allergyDrug'],
  1:['addr_no','addr_tambon','addr_amphoe','addr_province','addr_zip','phone'],
  2:['ec_name','ec_relation','ec_phone'],
  3:[],
  4:[]
};
function validateStep(i){
  if(isSubmitted) return true;
  const need = requiredByStep[i]||[];
  let ok=true;
  need.forEach(name=>{
    const val = data[name];
    const fieldEl = document.querySelector(`[data-field="${name}"]`);
    const missing = !val || (typeof val==='string' && val.trim()==='');
    if(fieldEl){ fieldEl.classList.toggle('invalid', missing); }
    if(missing) ok=false;
  });
  if(i===0 && data.prefix === 'อื่นๆ' && !data.prefixOther.trim()){
    ok = false;
  }
  if(i===0 && data.religion === 'อื่นๆ' && !data.religionOther.trim()){
    ok = false;
  }
  if(i===0 && data.nid && !/^\d{13}$/.test(data.nid)){
    const fe=document.querySelector('[data-field="nid"]');
    if(fe){ fe.classList.add('invalid'); fe.querySelector('.err-msg').textContent='เลขบัตรประชาชนต้องมี 13 หลัก'; }
    ok=false;
  }
  if(!ok){
    const firstInvalid=document.querySelector('.field.invalid');
    if(firstInvalid) firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
  }
  return ok;
}

/* ---------------- staff portal modal ---------------- */
function openStaffModal(){
  const todayStr = new Date().toISOString().split('T')[0];
  const container = document.getElementById('staffModalContainer');
  
  function renderModalContent(filterDate){
    const submissions = getAllSubmissions();
    const filtered = submissions.filter(item => {
      if(!filterDate) return true;
      if(!item.createdAt) return false;
      return item.createdAt.startsWith(filterDate);
    });

    let rowsHtml = '';
    if(filtered.length === 0){
      rowsHtml = `<tr><td colspan="6" style="text-align:center; color:#777; padding:20px;">ไม่พบข้อมูลการลงทะเบียนในวันที่เลือก</td></tr>`;
    } else {
      filtered.forEach((item, index) => {
        const fullPrefix = item.prefix === 'อื่นๆ' ? item.prefixOther : item.prefix;
        const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleString('th-TH') : '-';
        const isPrinted = item.printed;
        const statusBadge = isPrinted 
          ? `<span class="badge-status badge-printed">พิมพ์แล้ว (${new Date(item.printedAt).toLocaleTimeString('th-TH')})</span>` 
          : `<span class="badge-status badge-unprinted">ยังไม่เคยพิมพ์</span>`;

        rowsHtml += `
          <tr>
            <td>${index + 1}</td>
            <td>${esc(fullPrefix)}</td>
            <td>${esc(item.firstname)}</td>
            <td>${esc(item.lastname)}</td>
            <td>${dateFormatted}<br><small style="color:#666;">${statusBadge}</small></td>
            <td>
              <button class="btn btn-primary" style="padding:4px 10px; font-size:12px;" onclick="printPatientDoc('${item.id}')">🖨️ พิมพ์เอกสาร PDF</button>
            </td>
          </tr>
        `;
      });
    }

    container.innerHTML = `
      <div class="modal-overlay" id="staffModalOverlay">
        <div class="modal-content">
          <div class="modal-header">
            <h3>🔒 ระบบจัดการสำหรับเจ้าหน้าที่ห้องเวชระเบียน รพ.พิจิตร</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
          </div>
          <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
              <div>
                <label style="display:inline-block; font-weight:600; margin-right:8px;">กรองตามวันที่กรอกข้อมูล:</label>
                <input type="date" id="filterDateInput" value="${filterDate||''}" style="width:160px; display:inline-block; padding:6px 10px;">
                <button class="btn btn-ghost" id="clearDateBtn" style="padding:6px 10px; font-size:13px;">แสดงทั้งหมด</button>
              </div>
              <div style="font-size:13px; color:var(--ink-soft);">ทั้งหมด ${filtered.length} รายการ</div>
            </div>
            <div class="table-responsive">
              <table class="staff-table">
                <thead>
                  <tr>
                    <th>ลำดับ</th>
                    <th>คำนำหน้า</th>
                    <th>ชื่อ</th>
                    <th>สกุล</th>
                    <th>วันที่กรอกข้อมูล / สถานะการพิมพ์</th>
                    <th>จัดการ</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('closeModalBtn').addEventListener('click', () => { container.innerHTML = ''; });
    document.getElementById('staffModalOverlay').addEventListener('click', (e) => { if(e.target.id === 'staffModalOverlay') container.innerHTML = ''; });
    document.getElementById('filterDateInput').addEventListener('change', (e) => { renderModalContent(e.target.value); });
    document.getElementById('clearDateBtn').addEventListener('click', () => { renderModalContent(''); });
  }

  renderModalContent(todayStr);
}

// Global function for printing specific patient from staff portal
window.printPatientDoc = function(id){
  const submissions = getAllSubmissions();
  const item = submissions.find(s => s.id === id);
  if(!item) return;

  // Mark as printed
  item.printed = true;
  item.printedAt = new Date().toISOString();
  saveAllSubmissions(submissions);

  // Build print area and trigger print
  buildPrintAreaFromData(item);
  window.print();

  // Refresh staff modal table
  openStaffModal();
};

  const fullEcRelation = patientData.ec_relation === 'อื่นๆ' ? patientData.ec_relationOther : patientData.ec_relation;

  pa.innerHTML=`
    <div class="p-head">
      <div>
        <h1>เอกสารลงทะเบียนผู้ป่วยใหม่ (Pre-registration) — โรงพยาบาลพิจิตร</h1>
        <p>พิมพ์เมื่อ ${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} | เจ้าหน้าที่ห้องบัตรสั่งพิมพ์ (พิมพ์แล้ว)</p>
      </div>
      ${patientData.photoDataUrl? `<img class="p-photo" src="${patientData.photoDataUrl}">` : ''}
    </div>

    <div class="p-sec"><h3>ข้อมูลส่วนตัว</h3><div class="p-grid">
      <div><b>ชื่อ-นามสกุล:</b> ${esc(`${fullPrefix} ${patientData.firstname} ${patientData.lastname}`.trim())}</div>
      <div><b>เลขบัตรประชาชน:</b> ${esc(patientData.nid)}</div>
      <div><b>วัน เดือน ปี เกิด:</b> ${patientData.dob? esc(thaiDate(patientData.dob))+' (อายุ '+calcAge(patientData.dob)+')':'-'}</div>
      <div><b>เพศ:</b> ${esc(patientData.gender)}</div>
      <div><b>สถานภาพสมรส:</b> ${esc(patientData.marital)||'-'}</div>
      <div><b>เชื้อชาติ/สัญชาติ:</b> ${esc(patientData.ethnicity)} / ${esc(patientData.nationality)}</div>
      <div><b>ศาสนา:</b> ${esc(fullReligion)||'-'}</div>
      <div><b>หมู่เลือด:</b> ${esc(patientData.blood)||'ไม่ทราบ'}</div>
      <div style="grid-column:1/-1;"><b>ประวัติแพ้ยา:</b> ${esc(patientData.allergyDrug)}</div>
    </div></div>

    <div class="p-sec"><h3>ข้อมูลการติดต่อ</h3><div class="p-grid">
      <div style="grid-column:1/-1;"><b>ที่อยู่ปัจจุบัน:</b> ${esc(`${patientData.addr_no} หมู่ ${patientData.addr_moo} ต.${patientData.addr_tambon} อ.${patientData.addr_amphoe} จ.${patientData.addr_province} ${patientData.addr_zip}`)}</div>
      <div><b>โทรศัพท์มือถือ:</b> ${esc(patientData.phone)}</div>
    </div></div>

    <div class="p-sec"><h3>ผู้ติดต่อฉุกเฉิน</h3><div class="p-grid">
      <div><b>ชื่อ-นามสกุล:</b> ${esc(patientData.ec_name)}</div>
      <div><b>ความสัมพันธ์:</b> ${esc(fullEcRelation)}</div>
      <div><b>ที่อยู่:</b> ${esc(patientData.ec_addr)||'-'}</div>
      <div><b>เบอร์โทร:</b> ${esc(patientData.ec_phone)}</div>
    </div></div>

    <div class="p-sign">
      <div>ลงชื่อผู้ป่วย: ${esc(patientData.signName)}</div>
      <div>ลงชื่อผู้ให้ข้อมูล: ${esc(patientData.infoGiverName) || '-'}</div>
      <div>วันที่: ${now.toLocaleDateString('th-TH')}</div>
    </div>

    <div class="p-staff">
      <h3>สำหรับเจ้าหน้าที่ห้องบัตร (Staff use only)</h3>
      <div class="row">
        <div>เลขประจำตัวผู้ป่วย (HN):</div>
        <div>วันที่รับเอกสาร:</div>
        <div>ผู้บันทึกข้อมูล:</div>
      </div>
    </div>
  `;
}

/* ---------------- boot ---------------- */
function renderAll(){
  renderSteps();
  renderPanel();
  updateCard();
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('btnStaffPortal').addEventListener('click', openStaffModal);
document.getElementById('openStaffModalBtn').addEventListener('click', () => {
  // Easter egg: click 3 times quickly or directly open staff modal
  openStaffModal();
});

renderAll();
</script>
